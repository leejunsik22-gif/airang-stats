<style>

*{box-sizing:border-box}html,body{margin:0}

.apps{display:grid;grid-template-columns:400px 1fr;gap:16px;margin-top:14px;align-items:start}

body{background:var(--ground);color:var(--ink);font-family:'Noto Sans KR',system-ui,sans-serif;font-size:14px;line-height:1.5;-webkit-font-smoothing:antialiased}
a{color:var(--indigo-ink)}

.pkpis .d{font-size:12px;font-weight:800;margin-top:2px}.up{color:var(--mint-ink)}.dn{color:var(--coral-ink)}.light{color:var(--muted)!important;font-weight:700!important}
:root{--ok-c:#13A06F;--warn-c:#D08A00}

.seg{display:flex;gap:6px}.seg button{border:0;padding:6px 12px;border-radius:9px;font:inherit;font-size:12.5px;font-weight:800;background:var(--ground);color:var(--muted);cursor:pointer}.seg button.on{background:#151B3B;color:#fff}
.ptbl{width:100%;border-collapse:collapse;font-size:13.5px}.ptbl th{text-align:left;color:var(--muted);font-weight:700;font-size:12px;padding:7px 8px;border-bottom:1px solid var(--line);white-space:nowrap}
.ptbl th.sortable{cursor:pointer}.ptbl th.on{color:var(--indigo-ink)}.ptbl td{padding:6px 8px;border-bottom:1px solid var(--line)}.ptbl tr{cursor:pointer}.ptbl tr:hover td{background:var(--ground)}.ptbl tr.sel td{background:var(--indigo-bg)}
.cn{display:flex;align-items:center;gap:9px;font-weight:800}.cn i{width:10px;height:10px;border-radius:3px;display:inline-block}
.tag{font-size:11px;font-weight:800;border-radius:6px;padding:2px 6px;background:var(--ground);color:var(--muted)}.tag.s{background:#FDE9EF;color:#B03A62}.tag.i{background:#E3FAF2;color:#0B7A5A}.tag.c{background:#FBF0E1;color:#8A5A1C}
.num{font-weight:900;text-align:right}.ptbl .more{text-align:center;color:var(--muted);font-size:12.5px;cursor:pointer}
.pdot{width:9px;height:9px;border-radius:50%;display:inline-block;margin-right:6px;flex:none}.pdot.ok{background:#13A06F}.pdot.wa{background:#E0A100}.pdot.ba{background:#E8553F}
.lnk{color:var(--indigo-ink);font-weight:800;font-size:12.5px;text-decoration:none;cursor:pointer}

.pbot{display:grid;grid-template-columns:1.6fr 1fr;gap:16px;margin-top:16px}
.rbars{display:flex;align-items:flex-end;gap:7px;height:170px;margin-top:4px}.rbars div{flex:1;display:flex;flex-direction:column;justify-content:flex-end;align-items:stretch}.rbars b{display:block}.rbars b:last-of-type{border-radius:5px 5px 0 0}
.rbars em{font-style:normal;font-size:10.5px;font-weight:800;text-align:center;color:var(--muted)}.rbars small{font-size:10.5px;color:var(--muted);text-align:center;margin-top:4px;white-space:nowrap}
.lg{display:flex;gap:14px;font-size:12px;color:var(--muted);margin-top:6px}.lg i{width:10px;height:10px;border-radius:3px;display:inline-block;margin-right:5px;vertical-align:-1px}

</head>

    return `<div class="pcard mdata"><div class="hd"><i class="pdot ${hl === "ok" ? "ok" : hl === "warn" ? "wa" : "ba"}"></i><h3>${c.name}</h3><span class="tag ${tagCls(c)}">${sidoOf(c)}</span></div>
      <div class="mpills">${FILES.map(([k, n, h]) => { const v = f[k]; if (v === null && k === "deals") return `<span class="pill">${n} 준비 중</span>`; const [lv, l] = freshLevel(v, hrsOf(c, k, h)); return `<span class="pill p-${lv}">${n} ${l}</span>`; }).join("")}</div></div>`; }).join("") +
    `<p class="legend">초록 정상 · 노랑 늦음 · 빨강 멈춤. <a class="lnk" href="https://github.com/leejunsik22-gif/airang-cities/actions" target="_blank" rel="noopener">수집 기록 ↗</a></p>`;
}
function renderPC() {
  const M = !isPC();
  loadRuns(); if (!kwState) setTimeout(kwLoad, 50);
  const bad = CITIES.filter(c => cityHealth(c) !== "ok").length;
  const nav = PC_NAV.map(([k, ic, l]) => k === "sep" ? `<div class="psep">${l}</div>` : `<button class="pnav ${pcTab === k ? "on" : ""}" onclick="pcGo('${k}')">${ic} ${l}${k === "cities" ? `<span class="n">${CITIES.length}</span>` : k === "data" && bad ? `<span class="n warn">${bad}</span>` : ""}</button>`).join("");
  const title = (PC_NAV.find(x => x[0] === pcTab) || [, , "대시보드"])[2];
  const when = DATA ? new Date(DATA.at).toLocaleString("ko-KR", { month: "numeric", day: "numeric", weekday: "short", hour: "2-digit", minute: "2-digit" }) : "";
  const top = `<div class="ptop"><div><h1>${title}</h1><div class="sub">${when} 기준 · ${SIDO_LIST.map(x => `${x} ${CITIES.filter(c => sidoOf(c) === x).length}곳`).join(" · ")}${busy ? ` · 불러오는 중 ${prog}/${CITIES.length}` : ""}</div></div>
    ${pcTab === "cities" ? `<input class="psearch" placeholder="🔍 도시 이름으로 찾기" value="${esc(pcQ)}" oninput="pcSearch(this.value)">` : `<span class="sp"></span>`}
    <button class="btn soft" onclick="refreshAll()" ${busy ? "disabled" : ""}>↻ 새로고침</button><button class="btn soft" onclick="lock()">잠그기</button></div>
    ${busy ? `<div class="progress"><i style="width:${Math.round(prog / CITIES.length * 100)}%"></i></div>` : ""}${DEMO ? `<div class="demo">시안 화면이에요. 숫자는 예시예요.</div>` : ""}`;
  let body = "";
  if (!DATA) body = `<div class="pcard note">도시 ${CITIES.length}곳 통계를 불러오고 있어요.</div>`;
  else if (pcTab === "dash") {
    const S = CITIES.map(c => [c, cityStats(c)]), sum = f => S.reduce((a, [, s]) => a + (s[f] || 0), 0);
    const errC = CITIES.filter(c => (DATA.city[c.k] || {}).err);
    var errBox = errC.length ? `<div class="pcard" style="border:2px solid #E8553F;margin-bottom:14px"><b style="color:#C93D22">통계를 못 읽은 도시 ${errC.length}곳</b> <button class="btn soft" style="margin-left:8px;height:30px" onclick="snapTried=false;loadSnap()">15분 전 모음으로 보기</button>
      <div style="font-size:12.5px;color:var(--muted);margin-top:6px;line-height:1.7">${errC.map(c => `${c.name}: ${esc(DATA.city[c.k].err)}`).join("<br>")}</div></div>` : "";
    const adAll = S.reduce((a, [, s]) => a + s.ad.reduce((b, h) => b + h.count, 0), 0);
    const new30 = CITIES.reduce((t, c) => t + days7(30).reduce((a, x) => a + dayCount((DATA.city[c.k] || {}).hits || [], "방문-새로", x.y), 0), 0);
    const pct = (a, b) => b ? Math.round((a - b) / b * 100) : 0, d1 = pct(sum("today"), sum("yest"));
    const worst = CITIES.filter(c => cityHealth(c) !== "ok").map(c => c.name);
    body = errBox + `<div class="pkpis">
      <div class="pcard"><div class="k">오늘 방문한 사람</div><div class="v">${fmt(sum("today"))}<small>명</small></div><div class="d ${d1 >= 0 ? "up" : "dn"}">어제(${fmt(sum("yest"))})보다 ${d1 >= 0 ? "+" : ""}${d1}%</div></div>
      <div class="pcard"><div class="k">최근 7일 방문</div><div class="v">${fmt(sum("w7"))}<small>명</small></div><div class="d light">하루 평균 ${fmt(Math.round(sum("w7") / 7))}명</div></div>
      <div class="pcard"><div class="k">처음 온 사람 · 30일</div><div class="v">${fmt(new30)}<small>명</small></div><div class="d light">새 기기 기준</div></div>
      <div class="pcard"><div class="k">광고 누름 · 30일</div><div class="v">${fmt(adAll)}<small>회</small></div><div class="d light" style="cursor:pointer" onclick="pcGo('ads')">광고 관리 ›</div></div>
      <div class="pcard"><div class="k">수집 이상</div><div class="v" style="color:${worst.length ? "var(--warn-c)" : "var(--ok-c)"}">${worst.length}<small>곳</small></div><div class="d" style="cursor:pointer;color:${worst.length ? "var(--warn-c)" : "var(--ok-c)"}" onclick="pcGo('data')">${worst.length ? esc(worst.slice(0, 3).join("·")) + " ›" : "모두 정상"}</div></div></div>
      <div class="pbot"><div class="pcard"><div class="hd"><h3>지역별 방문 · 14일</h3></div>${pcRegionBars()}</div>
        <div class="pcard"><div class="hd"><h3>최근 수집·배포</h3><span class="sp"></span><a class="lnk" onclick="pcGo('deploy')">모두 ›</a></div>${Array.isArray(RUNS) ? RUNS.slice(0, 7).map(runRow).join("") : `<span class="sub">${RUNS && RUNS.err ? "GitHub 기록을 못 읽었어요" : "불러오는 중…"}</span>`}</div></div>${M ? `<div class="mconn">${pcConn()}</div>` : ""}`;
  } else if (pcTab === "cities") body = M ? `<input class="psearch m" placeholder="🔍 도시 이름으로 찾기" value="${esc(pcQ)}" oninput="pcQ=this.value.trim();document.getElementById('mlist').innerHTML=pcList(99)"><div class="pcard"><div class="hd">${pcSeg()}<span class="sp"></span>${pcSortChips()}</div><div id="mlist">${pcList(99)}</div></div>` : `<div class="pmid"><div class="pcard"><div class="hd"><h3>도시 ${CITIES.length}곳</h3>${pcSeg()}<span class="sp"></span><span class="sub">제목(오늘·7일·광고)을 누르면 정렬</span></div><table class="ptbl" id="pctable">${pcTable(99)}</table></div>${pcPhone(620)}</div>`;
  else if (pcTab === "apps") body = M ? mApps() : viewOne();
  else if (pcTab === "traffic") body = viewTraffic() + `<h2>도시별 7일</h2>` + viewHome().split("<h2>도시별</h2>")[1];
  else if (pcTab === "data") body = M ? mData() : viewData();
  else if (pcTab === "ads") body = viewAds();
  else if (pcTab === "deploy") body = (M ? `<div class="mconn">${pcConn()}</div>` : "") + `<div class="pcard">${Array.isArray(RUNS) ? RUNS.slice(0, 40).map(r => runRow(r).replace("</em>", `</em><small>${esc(r.repo)} · ${esc((r.title || "").slice(0, 40))}</small>`)).join("") : "불러오는 중…"}</div>
    <p class="legend">GitHub Actions 기록이에요 (5분마다 새로). 줄을 누르면 자세한 기록이 열려요.</p>`;
  else if (pcTab === "newcity") body = `<div class="pcard newcity"><h3>새 도시 여는 순서</h3><ol>
    <li><b>Claude에게</b> "○○ 열어 줘"라고 말해요 — 도시 설정·첫 수집·앱 화면은 Claude가 해요.</li>
    <li><b>DNS</b> 한 줄: <a href="https://dash.cloudflare.com/ec2068662f417d156ec0ebeda41a396e/daejeon.example.invalid/dns/records" target="_blank" rel="noopener">Cloudflare DNS ↗</a> → CNAME <code>도시</code> → <code>airang-도시.pages.dev</code> (주황 구름 켬)</li>
    <li><b>GoatCounter</b> 사이트 하나: <a href="https://airang-daejeon.goatcounter.com/settings/sites" target="_blank" rel="noopener">사이트 추가 ↗</a> → <code>도시-edu-app</code></li>
    <li><b>그림</b> (나중에 해도 돼요): GPT에 한 장씩 <b>1200×500</b> — 동화풍 3D, 엄마·아이 뒷모습, 글자 없이</li>
    <li>미리보기를 보고 <b>"올려"</b> 하면 앱·입구·관리자·관제에 한꺼번에 들어가요.</li></ol>
    <div class="row2"><a class="btn soft" href="https://github.com/leejunsik22-gif/airang-cities/actions/workflows/newcity.yml" target="_blank" rel="noopener">첫 수집 기록 ↗</a><a class="btn soft" href="https://github.com/leejunsik22-gif/airang-cities/blob/main/app/cities.json" target="_blank" rel="noopener">도시 설정 파일 ↗</a></div>
    <h3 style="margin-top:18px">남은 곳</h3><p class="sub">서울·경기: 모두 열었어요<br>인천: 서해·검단·영종·제물포 (2026-07 새로 생긴 구)</p></div>`;
  else if (pcTab === "settings") body = viewLinks();
  $app.className = "pcwrap" + (M ? " m" : "");
  if (M) {
    const mnav = PC_NAV.filter(x => x[0] !== "sep").map(([k, ic, l]) => `<button class="${pcTab === k ? "on" : ""}" onclick="pcGo('${k}')">${ic} ${l.replace("배포·수집 기록", "기록").replace("바로가기·관제", "바로가기").replace("새 도시 열기", "새 도시")}${k === "data" && bad ? ` <b class="nb">${bad}</b>` : ""}</button>`).join("");
    $app.innerHTML = `<div class="mtop"><div class="logo">아</div><div style="flex:1;min-width:0"><b>아이랑 관리자</b><div class="sub">${when} 기준${busy ? ` · 불러오는 중 ${prog}/${CITIES.length}` : ""}</div></div>
      <button class="btn soft sm" onclick="refreshAll()" ${busy ? "disabled" : ""}>↻</button><button class="btn soft sm" onclick="lock()">잠금</button></div>
      <nav class="mnav">${mnav}</nav>${busy ? `<div class="progress"><i style="width:${Math.round(prog / CITIES.length * 100)}%"></i></div>` : ""}${DEMO ? `<div class="demo">시안 화면이에요. 숫자는 예시예요.</div>` : ""}
      <main class="mmain"><h1 class="mh1">${title}</h1>${body}</main>`;
    setTimeout(() => { const on = document.querySelector(".mnav .on"); if (on) on.scrollIntoView({ inline: "center", block: "nearest" }); }, 0);
    return;
  }
  $app.className = "pcwrap";
  $app.innerHTML = `<div class="pc"><aside class="pside"><div class="pbrand"><div class="logo">아</div><div><b>아이랑 관리자</b><small>PC · 송골랩</small></div></div>${nav}${pcConn()}</aside><main class="pmain">${top}${body}</main></div>`;
}
function pcSeg() { return `<div class="seg">${[["all", "전체 " + CITIES.length], ...SIDO_LIST.map(x => [x, x + " " + CITIES.filter(c => sidoOf(c) === x).length])].map(([k, l]) => `<button class="${pcSido === k ? "on" : ""}" onclick="pcSet('sido','${k}')">${l}</button>`).join("")}</div>`; }
let pcWas = null;
window.addEventListener("resize", () => { const w = isPC(); if (w !== pcWas) { pcWas = w; if (unlocked) render(); } });

// ───── 로그인 ─────
function viewSetup() {
  $app.innerHTML = `<div class="login card"><div class="logo" style="margin-bottom:12px">아</div><h1>아이랑 관리자</h1>
    <p class="note">GoatCounter API 키를 이 브라우저에 한 번 넣어 주세요. 키는 이 브라우저에만 저장돼요. (앱 관리자에서 쓰던 <b>admin</b> 키 — 도시 7곳을 다 읽을 수 있는 키)</p>
    <input id="k" type="password" autocomplete="off" placeholder="API 키 붙여 넣기">
    <div class="k">관리자 비밀번호 (숫자 4자리)</div>
    <input id="p1" type="password" inputmode="numeric" maxlength="4" placeholder="숫자 4자리"><input id="p2" type="password" inputmode="numeric" maxlength="4" placeholder="한 번 더">
    <button class="btn" style="width:100%;justify-content:center;height:46px" onclick="saveKey()">등록</button></div>`;
}
async function saveKey() {
  const k = document.getElementById("k").value.trim(), a = document.getElementById("p1").value, b = document.getElementById("p2").value;
  if (k.length < 10) return alertMsg("API 키를 붙여 넣어 주세요");
  if (!/^\d{4}$/.test(a)) return alertMsg("비밀번호는 숫자 4자리예요");
  if (a !== b) return alertMsg("두 번 넣은 비밀번호가 달라요");
  ls.set(KEY, k); ls.set(PIN, await pinHash(a)); unlocked = true; DATA = null; ls.del(CACHE); render();
}
function viewPin() {
  $app.innerHTML = `<div class="login card"><div class="logo" style="margin-bottom:12px">아</div><h1>아이랑 관리자</h1><p class="note">비밀번호를 넣어 주세요.</p>
    <input id="pin" type="password" inputmode="numeric" maxlength="4" placeholder="숫자 4자리" autofocus>
    <div id="msg" class="note" style="color:var(--coral-ink)"></div>
    <button class="btn soft" style="margin-top:6px" onclick="forget()">비밀번호를 잊었어요 (키 지우고 다시 등록)</button></div>`;
  const el = document.getElementById("pin");
  el.addEventListener("input", async () => { if (/^\d{4}$/.test(el.value)) { if (await pinHash(el.value) === ls.get(PIN)) { unlocked = true; render(); } else { el.value = ""; document.getElementById("msg").textContent = "비밀번호가 달라요"; } } });
  setTimeout(() => el.focus(), 50);
}
function forget() { ls.del(KEY); ls.del(PIN); ls.del(CACHE); DATA = null; unlocked = false; render(); }
function alertMsg(t) { let m = document.getElementById("amsg"); if (!m) { m = document.createElement("div"); m.id = "amsg"; m.className = "note"; m.style.color = "var(--coral-ink)"; document.querySelector(".login").appendChild(m); } m.textContent = t; }

// ───── 시안용 예시 숫자 (?demo=1) ─────
if (DEMO) {
  const rnd = (a, b) => a + Math.floor(Math.random() * (b - a + 1));
  const ds = [...Array(30)].map((_, i) => kstYmd(new Date(Date.now() - (29 - i) * 86400e3)));
  const base = { yuseong: 3, djseogu: 3, djjunggu: 2, djdonggu: 2, daedeok: 2 };   // 가상 기본값(대전)
  const ser = f => ds.map((day, i) => ({ day, daily: f(i) }));
  DATA = { at: Date.now(), city: {}, fresh: {}, ads: { ...ADS_FALLBACK, from: "fallback" } };
  for (const c of CITIES) {
    const b = base[c.k] || 1, v = ds.map((_, i) => Math.max(0, Math.round(b * (0.5 + i / 40) + rnd(-2, 3))));
    const n = v.map(x => Math.round(x * 0.4));
    DATA.city[c.k] = { err: "", refs: [["(직접 방문 · 앱)", b * 5], ["teamblind.com", Math.round(b * 2.1)], ["m.search.naver.com", Math.round(b * .8)], ["kakao", Math.round(b * .5)], ["google.com", Math.round(b * .3)]],
      hits: [{ path: "방문-하루", event: true, count: 0, stats: ser(i => v[i]) }, { path: "방문-새로", event: true, stats: ser(i => n[i]) }, { path: "방문-다시", event: true, stats: ser(i => v[i] - n[i]) },
        { path: "방문-열기-1", event: true, stats: ser(i => v[i]) }, { path: "방문-열기-2", event: true, stats: ser(i => Math.round(v[i] * .5)) }, { path: "방문-열기-3", event: true, stats: ser(i => Math.round(v[i] * .2)) },
        { path: "광고-lagrills-info", event: true, count: Math.round(b * .9) }, { path: "광고-lagrills-book", event: true, count: Math.round(b * .25) }, { path: "광고-lagrills-tel", event: true, count: Math.round(b * .1) }, { path: "광고-lagrills-map", event: true, count: Math.round(b * .15) },
        { path: "/ad", event: false, count: Math.round(b * 1.6) }, { path: "급식-보기", event: true, count: b * 3 }, { path: "학원-비교", event: true, count: b * 2 }, { path: "행사-도서관", event: true, count: b }, { path: "날씨-보기", event: true, count: Math.round(b * 1.5) }] };
    const now = new Date(Date.now() + 9 * 3600e3).toISOString().slice(0, 16).replace("T", " ");
    const ago = h => new Date(Date.now() + 9 * 3600e3 - h * 3600e3).toISOString().slice(0, 16).replace("T", " ");
    DATA.fresh[c.k] = { latest: ago(5), meals: ago(5), kinder: ago(6), events: ago(5), jobs: ago(5), weather: ago(2), academies: ago(c.k === "yongin" ? 96 : 5), deals: ["yongin", "suwon"].includes(c.k) ? null : ago(4) };
    if (c.k === "goyang") DATA.fresh[c.k].events = ago(50);
  }
  unlocked = true; ls.get = (k) => k === KEY || k === PIN ? "demo" : null;
  const m = location.search.match(/tab=(\w+)/); if (m) tab = m[1];
}
render();
if ("serviceWorker" in navigator && !DEMO) navigator.serviceWorker.register("sw.js").catch(() => {});
</script>
