<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<title>아이랑 관리자</title>
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#4B5BF0">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="아이랑 관리자">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;800&display=swap">
<style>
:root{--ground:#EEF1F8;--card:#fff;--ink:#141A2E;--muted:#5C6478;--line:#E6E9F2;--indigo:#4B5BF0;--indigo-ink:#3442C9;--indigo-bg:#E8EBFF;
--coral:#FF7A59;--coral-ink:#C93D22;--coral-bg:#FFE9E2;--mint-ink:#13795F;--mint-bg:#E2F6F0;--sun-ink:#8A5300;--sun-bg:#FFF0E0;--shadow:0 1px 2px rgba(20,26,46,.06),0 6px 20px rgba(20,26,46,.06)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--ground:#0E1220;--card:#171C2E;--ink:#EEF1FA;--muted:#9AA3BC;--line:#262D45;--indigo-bg:#232A55;--indigo-ink:#AEB6FF;--coral-bg:#3A221C;--coral-ink:#FF9C82;--mint-bg:#14302A;--mint-ink:#6FD8B6;--sun-bg:#33281A;--sun-ink:#F5C26B;--shadow:none}}
:root[data-theme="dark"]{--ground:#0E1220;--card:#171C2E;--ink:#EEF1FA;--muted:#9AA3BC;--line:#262D45;--indigo-bg:#232A55;--indigo-ink:#AEB6FF;--coral-bg:#3A221C;--coral-ink:#FF9C82;--mint-bg:#14302A;--mint-ink:#6FD8B6;--sun-bg:#33281A;--sun-ink:#F5C26B;--shadow:none}
*{box-sizing:border-box}html,body{margin:0}
.apps-pick{display:flex;flex-direction:column;gap:10px}.grp{display:flex;flex-wrap:wrap;gap:6px;align-items:center}.grp b{width:40px;font-size:13px;color:var(--muted)}
.chip{border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:999px;padding:7px 13px;font:inherit;font-size:13.5px;font-weight:700;cursor:pointer}
.chip.on{background:var(--indigo);border-color:var(--indigo);color:#fff}
.chip small{font-weight:800;opacity:.7;margin-left:2px}.chip .dot{display:inline-block;width:8px;height:8px;margin-right:6px;vertical-align:1px}
.apps{display:grid;grid-template-columns:400px 1fr;gap:16px;margin-top:14px;align-items:start}
.phone{width:400px;height:820px;border-radius:44px;background:#111;padding:12px;box-shadow:var(--shadow)}
.phone iframe{width:100%;height:100%;border:0;border-radius:34px;background:#fff}
.apps-side{display:flex;flex-direction:column;gap:14px}
.routes{display:flex;flex-wrap:wrap;gap:6px;margin-top:12px}.rt{border:0;background:var(--indigo-bg);color:var(--indigo-ink);border-radius:10px;padding:7px 11px;font:inherit;font-size:13px;font-weight:700;cursor:pointer}.rt.on{background:var(--indigo);color:#fff}
.apps .mini{grid-template-columns:repeat(4,1fr)}
.frow{display:flex;justify-content:space-between;padding:6px 0;border-bottom:1px solid var(--line);font-size:13.5px}.frow:last-child{border:0}
@media (max-width:760px){.apps{grid-template-columns:1fr}.phone{width:100%;max-width:400px;height:76vh;margin:0 auto;border-radius:36px;padding:8px}.phone iframe{border-radius:28px}}
body{background:var(--ground);color:var(--ink);font-family:'Noto Sans KR',system-ui,sans-serif;font-size:14px;line-height:1.5;-webkit-font-smoothing:antialiased}
a{color:var(--indigo-ink)}
.wrap{max-width:1180px;margin:0 auto;padding:18px 16px 60px}
header{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:14px}
.logo{width:38px;height:38px;border-radius:11px;background:linear-gradient(135deg,#8C97FF,var(--indigo));display:grid;place-items:center;color:#fff;font-weight:800;font-size:17px}
h1{font-size:20px;margin:0;font-weight:800}.sub{color:var(--muted);font-size:12.5px}
.sp{flex:1}
.btn{border:0;border-radius:10px;padding:9px 14px;font:inherit;font-weight:700;cursor:pointer;background:var(--indigo);color:#fff;text-decoration:none;display:inline-flex;align-items:center;gap:6px}
.btn.soft{background:var(--card);color:var(--ink);box-shadow:var(--shadow);border:1px solid var(--line)}
.btn:disabled{opacity:.5;cursor:default}
nav.tabs{display:flex;gap:6px;overflow-x:auto;margin:4px 0 16px;padding-bottom:2px}
nav.mtabs{position:sticky;top:0;z-index:5;background:var(--ground);padding:8px 0 8px;margin:0 0 12px;scrollbar-width:none}nav.mtabs::-webkit-scrollbar{display:none}
.mconn .conn{margin:0 0 6px;color:#C9CFF0}
nav.tabs button{border:1px solid var(--line);background:var(--card);color:var(--muted);border-radius:999px;padding:8px 14px;font:inherit;font-weight:700;cursor:pointer;white-space:nowrap}
nav.tabs button.on{background:var(--ink);color:var(--card);border-color:var(--ink)}
.card{background:var(--card);border-radius:16px;box-shadow:var(--shadow);border:1px solid var(--line);padding:16px}
.grid{display:grid;gap:12px}
.kpis{grid-template-columns:repeat(4,1fr)}
.cities{grid-template-columns:repeat(auto-fill,minmax(260px,1fr))}
.two{grid-template-columns:1fr 1fr}
@media (max-width:760px){.kpis{grid-template-columns:repeat(2,1fr)}.two{grid-template-columns:1fr}}
.k{color:var(--muted);font-size:12px;font-weight:500}.v{font-size:26px;font-weight:800;letter-spacing:-.5px}
.v small{font-size:13px;font-weight:700;color:var(--muted);margin-left:2px}
.delta{font-size:12px;font-weight:700}.up{color:var(--mint-ink)}.down{color:var(--coral-ink)}
h2{font-size:16px;margin:22px 2px 10px;font-weight:800;display:flex;align-items:center;gap:8px}
h3{font-size:15px;margin:0;font-weight:800}
.city-head{display:flex;align-items:center;gap:8px;margin-bottom:10px}
.dot{width:9px;height:9px;border-radius:50%;background:var(--mint-ink);flex:none}.dot.warn{background:#E0A100}.dot.bad{background:var(--coral)}
.mini{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-bottom:10px}
.mini div{background:var(--ground);border-radius:10px;padding:8px 6px;text-align:center}
.mini b{display:block;font-size:18px}
.bars{display:flex;align-items:flex-end;gap:4px;height:92px;padding-top:14px}
.bars .c{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;min-width:0}
.bars .n{font-size:10px;font-weight:700}
.bars .b{width:70%;border-radius:5px 5px 2px 2px;background:linear-gradient(180deg,#8C97FF,var(--indigo));overflow:hidden;display:flex;flex-direction:column}
.bars .b i{display:block;background:linear-gradient(180deg,#FFB199,var(--coral))}
.bars .l{font-size:10px;color:var(--muted)}
.legend{font-size:11.5px;color:var(--muted);margin-top:6px}
table{width:100%;border-collapse:collapse;font-size:13px}
th,td{padding:8px 6px;border-bottom:1px solid var(--line);text-align:right;white-space:nowrap}
th:first-child,td:first-child{text-align:left}
th{color:var(--muted);font-weight:700;font-size:12px}
tr:last-child td{border-bottom:0}
.tbl{overflow-x:auto}
.pill{display:inline-block;border-radius:999px;padding:2px 9px;font-size:11.5px;font-weight:700}
.p-ok{background:var(--mint-bg);color:var(--mint-ink)}.p-warn{background:var(--sun-bg);color:var(--sun-ink)}.p-bad{background:var(--coral-bg);color:var(--coral-ink)}.p-ad{background:var(--sun-bg);color:var(--sun-ink)}
.ad{display:flex;gap:14px;align-items:flex-start;flex-wrap:wrap}
.ad .thumb{width:120px;height:68px;border-radius:10px;background:linear-gradient(135deg,var(--sun-bg),var(--coral-bg));display:grid;place-items:center;font-size:28px;flex:none;overflow:hidden}
.ad .thumb img{width:100%;height:100%;object-fit:cover}
.ad .meta{flex:1;min-width:200px}
.note{font-size:12.5px;color:var(--muted);line-height:1.7}
.login{max-width:420px;margin:8vh auto 0}
input{width:100%;font:inherit;padding:12px;border-radius:10px;border:1px solid var(--line);background:var(--ground);color:var(--ink);margin:6px 0 10px}
.bar-row{display:flex;align-items:center;gap:8px;margin:7px 0}
.bar-row .t{width:42%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.bar-row .track{flex:1;height:8px;background:var(--ground);border-radius:6px;overflow:hidden}
.bar-row .track i{display:block;height:100%;background:var(--indigo);border-radius:6px}
.bar-row .num{width:46px;text-align:right;font-weight:700}
.links{grid-template-columns:repeat(auto-fill,minmax(210px,1fr))}
.links a{display:flex;align-items:center;gap:10px;text-decoration:none;color:var(--ink)}
.links .ic{width:34px;height:34px;border-radius:10px;background:var(--indigo-bg);display:grid;place-items:center;font-size:17px;flex:none}
.progress{height:4px;background:var(--line);border-radius:3px;overflow:hidden;margin:6px 0 14px}.progress i{display:block;height:100%;background:var(--indigo);transition:width .3s}
.demo{background:var(--sun-bg);color:var(--sun-ink);border-radius:10px;padding:8px 12px;font-size:12.5px;font-weight:700;margin-bottom:12px}
.hide{display:none}

/* ── PC 화면 ── */
.pcwrap{padding:0}.pc{display:grid;grid-template-columns:232px 1fr;min-height:100vh}
.pside{background:#151B3B;color:#C9CFF0;padding:22px 14px;display:flex;flex-direction:column;gap:3px;position:sticky;top:0;height:100vh}
.pbrand{display:flex;gap:10px;align-items:center;margin:0 6px 20px}.pbrand b{color:#fff;font-size:16px;display:block}.pbrand small{font-size:11.5px;opacity:.7}
.pnav{display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:11px;font:inherit;font-size:14.5px;font-weight:700;background:none;border:0;color:inherit;cursor:pointer;text-align:left}
.pnav:hover{background:#222A5A}.pnav.on{background:#2B3470;color:#fff}.pnav .n{margin-left:auto;font-size:11.5px;background:#2B3470;border-radius:8px;padding:1px 7px}.pnav.on .n{background:var(--indigo)}.pnav .n.warn{background:#7A4A00;color:#FFD27A}
.psep{font-size:11px;letter-spacing:.5px;opacity:.5;margin:14px 12px 4px}
.conn{margin-top:auto;background:#1D2450;border-radius:14px;padding:13px}.conn h4{margin:0 0 6px;font-size:12px;color:#fff}.conn div{display:flex;justify-content:space-between;gap:6px;font-size:12px;padding:3px 0}
.conn .g{color:#5BE0A8}.conn .y{color:#FFD27A}.conn .r{color:#FF9C82}
.pmain{padding:22px 26px 60px;min-width:0}
.ptop{display:flex;align-items:center;gap:12px;margin-bottom:16px}.ptop h1{margin:0;font-size:23px}.ptop .sp{flex:1}
.psearch{margin-left:auto;width:320px;height:40px;border-radius:12px;background:var(--card);border:1px solid var(--line);padding:0 14px;font:inherit;color:var(--ink)}
.pcard{background:var(--card);border-radius:18px;padding:16px 18px;box-shadow:var(--shadow);min-width:0}
.pkpis{display:grid;grid-template-columns:repeat(5,1fr);gap:14px;margin-bottom:16px}.pkpis .k{font-size:12.5px;color:var(--muted)}.pkpis .v{font-size:29px;font-weight:900;margin-top:2px}.pkpis .v small{font-size:13px;color:var(--muted);margin-left:3px}
.pkpis .d{font-size:12px;font-weight:800;margin-top:2px}.up{color:var(--mint-ink)}.dn{color:var(--coral-ink)}.light{color:var(--muted)!important;font-weight:700!important}
:root{--ok-c:#13A06F;--warn-c:#D08A00}
.pmid{display:grid;grid-template-columns:1fr 352px;gap:16px;align-items:start}
.pcard .hd{display:flex;align-items:center;gap:10px;margin-bottom:10px}.pcard .hd .sp{flex:1}.pcard h3{margin:0;font-size:15.5px}
.seg{display:flex;gap:6px}.seg button{border:0;padding:6px 12px;border-radius:9px;font:inherit;font-size:12.5px;font-weight:800;background:var(--ground);color:var(--muted);cursor:pointer}.seg button.on{background:#151B3B;color:#fff}
.ptbl{width:100%;border-collapse:collapse;font-size:13.5px}.ptbl th{text-align:left;color:var(--muted);font-weight:700;font-size:12px;padding:7px 8px;border-bottom:1px solid var(--line);white-space:nowrap}
.ptbl th.sortable{cursor:pointer}.ptbl th.on{color:var(--indigo-ink)}.ptbl td{padding:6px 8px;border-bottom:1px solid var(--line)}.ptbl tr{cursor:pointer}.ptbl tr:hover td{background:var(--ground)}.ptbl tr.sel td{background:var(--indigo-bg)}
.cn{display:flex;align-items:center;gap:9px;font-weight:800}.cn i{width:10px;height:10px;border-radius:3px;display:inline-block}
.tag{font-size:11px;font-weight:800;border-radius:6px;padding:2px 6px;background:var(--ground);color:var(--muted)}.tag.s{background:#FDE9EF;color:#B03A62}.tag.i{background:#E3FAF2;color:#0B7A5A}.tag.c{background:#FBF0E1;color:#8A5A1C}
.num{font-weight:900;text-align:right}.ptbl .more{text-align:center;color:var(--muted);font-size:12.5px;cursor:pointer}
.pdot{width:9px;height:9px;border-radius:50%;display:inline-block;margin-right:6px;flex:none}.pdot.ok{background:#13A06F}.pdot.wa{background:#E0A100}.pdot.ba{background:#E8553F}
.lnk{color:var(--indigo-ink);font-weight:800;font-size:12.5px;text-decoration:none;cursor:pointer}
.phonebox{display:flex;flex-direction:column;align-items:center;position:sticky;top:16px}.phonebox .hd{width:100%}
.pphone{width:300px;border-radius:40px;background:#111;padding:10px;overflow:hidden}.pphone iframe{width:100%;height:100%;border:0;border-radius:31px;background:#fff}
.pchips{display:flex;flex-wrap:wrap;gap:6px;justify-content:center;margin-top:12px}
.pbot{display:grid;grid-template-columns:1.6fr 1fr;gap:16px;margin-top:16px}
.rbars{display:flex;align-items:flex-end;gap:7px;height:170px;margin-top:4px}.rbars div{flex:1;display:flex;flex-direction:column;justify-content:flex-end;align-items:stretch}.rbars b{display:block}.rbars b:last-of-type{border-radius:5px 5px 0 0}
.rbars em{font-style:normal;font-size:10.5px;font-weight:800;text-align:center;color:var(--muted)}.rbars small{font-size:10.5px;color:var(--muted);text-align:center;margin-top:4px;white-space:nowrap}
.lg{display:flex;gap:14px;font-size:12px;color:var(--muted);margin-top:6px}.lg i{width:10px;height:10px;border-radius:3px;display:inline-block;margin-right:5px;vertical-align:-1px}
.feedrow{display:grid;grid-template-columns:62px 16px 1fr auto;align-items:center;gap:6px;font-size:13px;padding:7px 0;border-bottom:1px solid var(--line);color:inherit;text-decoration:none}.feedrow:last-child{border:0}
.feedrow span{color:var(--muted);font-size:12px}.feedrow em{font-style:normal;font-size:12px;color:var(--muted)}.feedrow small{grid-column:3/5;color:var(--muted);font-size:11.5px;margin-top:-4px}
.newcity ol{line-height:2;padding-left:20px;margin:8px 0 14px}.newcity code{background:var(--ground);border-radius:6px;padding:1px 6px}.row2{display:flex;gap:8px}
@media (max-width:1350px){.pkpis{grid-template-columns:repeat(3,1fr)}.pbot{grid-template-columns:1fr 1fr}}

.refhead{display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between;margin:22px 0 10px}.refhead h2{margin:0}.refhead .seg small{opacity:.7;font-weight:700;margin-left:2px}
.pd .pdhead{display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between}.pd .seg button{white-space:nowrap}
.pddate{display:flex;align-items:center;gap:6px;font-size:13px}.pddate input{font:inherit;border:1px solid var(--line);border-radius:9px;padding:5px 8px;background:var(--card);color:var(--ink)}
.pdlist div{display:grid;grid-template-columns:22px 52px 38px 1fr 54px;gap:8px;align-items:center;padding:6px 0;border-bottom:1px solid var(--line);font-size:13px}.pdlist div:last-child{border:0}
.pdlist .sub{grid-column:2/6;margin-top:-4px;font-size:11.5px}.pdlist u{display:block;height:8px;border-radius:5px;background:var(--ground);text-decoration:none;overflow:hidden}.pdlist u i{display:block;height:100%;border-radius:5px}
.pd .rbars{display:flex;align-items:flex-end;gap:3px}.pd .rbars div{flex:1;display:flex;flex-direction:column;justify-content:flex-end;min-width:0}.pd .rbars b{display:block}
.pd .rbars em{font-style:normal;font-size:10px;font-weight:800;text-align:center;color:var(--muted)}.pd .rbars small{font-size:10px;color:var(--muted);text-align:center;margin-top:4px;white-space:nowrap}

/* ── 휴대폰 (가로 1100px 아래) ── */
.pcwrap.m{padding:0 0 40px}
.mtop{display:flex;align-items:center;gap:10px;padding:14px 14px 8px}.mtop b{font-size:16px}.mtop .sub{font-size:12px}.btn.sm{height:36px;padding:0 12px;font-size:13px}
.mnav{position:sticky;top:0;z-index:6;display:flex;gap:6px;overflow-x:auto;padding:8px 14px;background:var(--ground);scrollbar-width:none;border-bottom:1px solid var(--line)}.mnav::-webkit-scrollbar{display:none}
.mnav button{flex:none;border:1px solid var(--line);background:var(--card);color:var(--muted);border-radius:999px;padding:8px 13px;font:inherit;font-size:13.5px;font-weight:800;white-space:nowrap;cursor:pointer}
.mnav button.on{background:#151B3B;color:#fff;border-color:#151B3B}.mnav .nb{background:#E0A100;color:#fff;border-radius:8px;padding:0 6px;font-size:11px}
.mmain{padding:6px 14px}.mh1{font-size:20px;margin:6px 2px 12px}
.pcwrap.m .pkpis{grid-template-columns:1fr 1fr;gap:10px;margin-bottom:12px}.pcwrap.m .pkpis .pcard:last-child{grid-column:1/3}.pcwrap.m .pkpis .v{font-size:24px}
.pcwrap.m .pcard{padding:14px;border-radius:16px}.pcwrap.m .pbot{grid-template-columns:1fr;gap:12px;margin-top:12px}.pcwrap.m .pcard .hd{flex-wrap:wrap}
.mrow{display:grid;grid-template-columns:6px 1fr auto 44px;gap:10px;align-items:center;width:100%;border:0;border-bottom:1px solid var(--line);background:none;padding:10px 2px;font:inherit;color:inherit;text-align:left;cursor:pointer}
.mrow>i{height:34px;border-radius:3px}.mrow .mn{display:flex;flex-wrap:wrap;align-items:center;gap:6px;min-width:0}.mrow .mn small{flex-basis:100%;color:var(--muted);font-size:11.5px;display:flex;align-items:center}
.mrow svg{width:80px;height:24px}.mrow .mt{font-size:20px;font-weight:900;text-align:right}
.mmore{width:100%;border:0;background:var(--ground);border-radius:12px;padding:11px;margin-top:10px;font:inherit;font-weight:800;color:var(--indigo-ink);cursor:pointer}
.psearch.m{width:100%;margin:0 0 12px;height:44px}
.mframe{border-radius:18px;overflow:hidden;border:1px solid var(--line);height:72vh;background:#fff}.mframe iframe{width:100%;height:100%;border:0}
.mdata{margin-bottom:10px}.mdata .hd{margin-bottom:6px}.mpills{display:flex;flex-wrap:wrap;gap:6px}.mpills .pill{font-size:11.5px}
.mconn .conn{margin:12px 0 0;color:#C9CFF0}
.pcwrap.m .pd .pdlist div{grid-template-columns:22px 52px 38px 1fr 48px}
.pcwrap.m .grid.two,.pcwrap.m .grid.cities{grid-template-columns:1fr}
.pcwrap.m .rbars{gap:3px}.pcwrap.m .rbars div{min-width:0}.pcwrap.m .rbars em{font-size:9px}.pcwrap.m .rbars small{font-size:8.5px;overflow:hidden}
.pcwrap.m .lg{flex-wrap:wrap;gap:4px 12px}.pcwrap.m .lg span:last-child{flex-basis:100%;margin-left:0!important}
.pcwrap.m .feedrow{grid-template-columns:54px 14px 1fr auto}

/* ───────────────────────────────────────────────────────────────
   아이랑 브랜드 디자인 시스템 v1후보 (2026-11-02, 작업 가지 work)
   기본: 따뜻한 아이보리 + 깊은 네이비 / 보조: 절제된 코랄·세이지 / 골드 포인트 최소
   규칙: 글꼴 Noto Sans KR · 본문 15px/1.55 · 카드 곡률 20 · 버튼 곡률 14 · 터치 44px 이상
   이 파일은 각 화면의 기존 CSS "뒤에" 붙어 토큰과 공통 요소만 덮어쓴다(원본 CSS는 보존).
   ─────────────────────────────────────────────────────────────── */
:root{
  --ivory:#FAF7F1;--ivory-2:#F2EDE3;--paper:#FFFFFF;
  --navy:#1F2A44;--navy-ink:#16203A;--navy-soft:#E6E9F1;
  --coral:#D9654A;--coral-ink:#A33D27;--coral-bg:#FBE9E3;
  --sage:#5E8C7A;--sage-ink:#2E5A4B;--sage-bg:#E6F0EB;
  --gold:#B8923E;--gold-ink:#6F5415;--gold-bg:#F7EEDC;
  --ink:var(--navy-ink);--muted:#5B6274;--line:#E8E3D9;--ground:var(--ivory);

    <li><b>그림</b> (나중에 해도 돼요): GPT에 한 장씩 <b>1200×500</b> — 동화풍 3D, 엄마·아이 뒷모습, 글자 없이</li>
    <li>미리보기를 보고 <b>"올려"</b> 하면 앱·입구·관리자·관제에 한꺼번에 들어가요.</li></ol>
    <div class="row2"><a class="btn soft" href="https://github.com/leejunsik22-gif/airang-cities/actions/workflows/newcity.yml" target="_blank" rel="noopener">첫 수집 기록 ↗</a><a class="btn soft" href="https://github.com/leejunsik22-gif/airang-cities/blob/main/app/cities.json" target="_blank" rel="noopener">도시 설정 파일 ↗</a></div>
    <h3 style="margin-top:18px">지금 상태</h3><p class="sub">운영: 대전 5개 구 · 후보(비공개 설정만): 대구·부산·제주·충북·인천·광주·울산·세종 — 공개는 대표 계정의 publish-city '승인' 입력 뒤에만<br><b>서울·경기는 아이랑 대상이 아니에요</b>(tools/safety_policy.json — 검문이 공개를 거부)</p></div>`;
  else if (pcTab === "settings") body = viewLinks();
  else if (pcTab === "verify") body = verifyPanel();
  else if (pcTab === "hold") body = holdPanel();
  else if (pcTab === "ops") body = opsDetectPanel();
  else if (pcTab === "history") body = historyPanel();
  else if (pcTab === "security") body = securityPanel();
  $app.className = "pcwrap" + (M ? " m" : "");
  if (M) {
    const mnav = PC_NAV.filter(x => x[0] !== "sep").map(([k, ic, l]) => `<button class="${pcTab === k ? "on" : ""}" onclick="pcGo('${k}')">${ic} ${M_SHORT[l] || l}${k === "data" && bad ? ` <b class="nb">${bad}</b>` : ""}</button>`).join("");
    $app.innerHTML = aband() + `<div class="mtop"><div class="logo">아</div><div style="flex:1;min-width:0"><b>아이랑 관리자</b><div class="sub">${when} 기준${busy ? ` · 불러오는 중 ${prog}/${CITIES.length}` : ""}</div></div>
      <button class="btn soft sm" onclick="refreshAll()" ${busy ? "disabled" : ""}>↻</button><button class="btn soft sm" onclick="lock()">잠금</button></div>
      <nav class="mnav">${mnav}</nav>${busy ? `<div class="progress"><i style="width:${Math.round(prog / CITIES.length * 100)}%"></i></div>` : ""}${DEMO ? `<div class="demo">시안 화면이에요. 숫자는 예시예요.</div>` : ""}
      <main class="mmain"><h1 class="mh1">${title}</h1>${body}</main>`;
    setTimeout(() => { const on = document.querySelector(".mnav .on"); if (on) on.scrollIntoView({ inline: "center", block: "nearest" }); }, 0);
    return;
  }
  $app.className = "pcwrap";
  $app.innerHTML = `<div class="pc"><aside class="pside"><div class="pbrand"><div class="logo">아</div><div><b>아이랑 관리자</b><small>PC · 라그릴스</small></div></div>${nav}${pcConn()}</aside><main class="pmain">${aband()}${top}${body}</main></div>`;
}
function pcSeg() { return `<div class="seg">${[["all", "전체 " + CITIES.length], ...SIDO_LIST.map(x => [x, x + " " + CITIES.filter(c => sidoOf(c) === x).length])].map(([k, l]) => `<button class="${pcSido === k ? "on" : ""}" onclick="pcSet('sido','${k}')">${l}</button>`).join("")}</div>`; }
let pcWas = null;
window.addEventListener("resize", () => { const w = isPC(); if (w !== pcWas) { pcWas = w; if (unlocked) render(); } });

// ───── 로그인 ─────
function viewSetup() {
  $app.innerHTML = `<div class="login card"><div class="logo" style="margin-bottom:12px">아</div><h1>아이랑 관리자</h1>
    <p class="note">GoatCounter API 키를 한 번 넣어 주세요. 키는 비밀번호로 잠가서 이 브라우저에만 저장되고, 서버로 보내지 않아요.<br><b>권한은 "Stats(통계 읽기)"만 있는 키</b>를 쓰세요. 만드는 곳: <a href="https://airang-daejeon.goatcounter.com/user/api" target="_blank" rel="noopener">GoatCounter → API 토큰</a></p>
    <input id="k" type="password" autocomplete="off" placeholder="API 키 붙여 넣기">
    <div class="k">관리자 비밀번호 (숫자 6자리 이상, 또는 글자 8자 이상)</div>
    <input id="p1" type="password" autocomplete="new-password" placeholder="비밀번호"><input id="p2" type="password" autocomplete="new-password" placeholder="한 번 더">
    <button class="btn" style="width:100%;justify-content:center;height:46px" onclick="saveKey()">등록</button></div>`;
}
async function saveKey() {
  const k = document.getElementById("k").value.trim(), a = document.getElementById("p1").value, b = document.getElementById("p2").value;
  if (k.length < 10) return alertMsg("API 키를 붙여 넣어 주세요");
  if (!passOk(a)) return alertMsg("비밀번호는 숫자 6자리 이상 또는 글자 8자 이상이에요");
  if (a !== b) return alertMsg("두 번 넣은 비밀번호가 달라요");
  if (/^(\d)\1+$|^123456|^654321/.test(a)) return alertMsg("너무 쉬운 비밀번호예요");
  await vaultSeal(k, a); SESS = k; unlocked = true; DATA = null; ls.del(CACHE); touchIdle(); render();
}
function viewPin() {
  $app.innerHTML = `<div class="login card"><div class="logo" style="margin-bottom:12px">아</div><h1>아이랑 관리자</h1><p class="note">비밀번호를 넣어 주세요.</p>
    <input id="pin" type="password" autocomplete="current-password" placeholder="비밀번호" autofocus><button class="btn" style="width:100%;justify-content:center;height:46px;margin-top:8px" onclick="unlockNow()">열기</button>
    <div id="msg" class="note" style="color:var(--coral-ink)"></div>
    <button class="btn soft" style="margin-top:6px" onclick="forget()">비밀번호를 잊었어요 (키 지우고 다시 등록)</button></div>`;
  const el = document.getElementById("pin");
  el.addEventListener("keydown", e => { if (e.key === "Enter") unlockNow(); });
  setTimeout(() => el.focus(), 50);
}
let tries = 0;
async function unlockNow() { const el = document.getElementById("pin"), m = document.getElementById("msg"); if (!el.value) return;
  m.textContent = "확인 중…"; const k = await vaultOpen(el.value);
  if (k) { SESS = k; unlocked = true; tries = 0; touchIdle(); render(); }
  else { tries++; el.value = ""; m.textContent = "비밀번호가 달라요"; if (tries >= 5) { m.textContent = "5번 틀려서 30초 쉬어요"; el.disabled = true; setTimeout(() => { el.disabled = false; tries = 0; m.textContent = ""; }, 30000); } }
}
function forget() { ls.del(VAULT); ls.del(KEY); ls.del(PIN); ls.del(CACHE); DATA = null; SESS = null; unlocked = false; render(); }
function alertMsg(t) { let m = document.getElementById("amsg"); if (!m) { m = document.createElement("div"); m.id = "amsg"; m.className = "note"; m.style.color = "var(--coral-ink)"; document.querySelector(".login").appendChild(m); } m.textContent = t; }

// ───── 시안용 예시 숫자 (?demo=1) ─────
if (DEMO) {
  const rnd = (a, b) => a + Math.floor(Math.random() * (b - a + 1));
  const ds = [...Array(30)].map((_, i) => kstYmd(new Date(Date.now() - (29 - i) * 86400e3)));
  const base = { yuseong: 3, djseogu: 3, djjunggu: 2, djdonggu: 2, daedeok: 2 };   // 가상 기본값(대전)
  const ser = f => ds.map((day, i) => ({ day, daily: f(i) }));
  DATA = { at: Date.now(), city: {}, fresh: {}, ads: { ...ADS_FALLBACK, from: "fallback" } };
  for (const c of CITIES) {
    const b = base[c.k] || 1, v = ds.map((_, i) => Math.max(0, Math.round(b * (0.5 + i / 40) + rnd(-2, 3))));
    const n = v.map(x => Math.round(x * 0.4));
    DATA.city[c.k] = { err: "", refs: [["(직접 방문 · 앱)", b * 5], ["teamblind.com", Math.round(b * 2.1)], ["m.search.naver.com", Math.round(b * .8)], ["kakao", Math.round(b * .5)], ["google.com", Math.round(b * .3)]],
      hits: [{ path: "방문-하루", event: true, count: 0, stats: ser(i => v[i]) }, { path: "방문-새로", event: true, stats: ser(i => n[i]) }, { path: "방문-다시", event: true, stats: ser(i => v[i] - n[i]) },
        { path: "방문-열기-1", event: true, stats: ser(i => v[i]) }, { path: "방문-열기-2", event: true, stats: ser(i => Math.round(v[i] * .5)) }, { path: "방문-열기-3", event: true, stats: ser(i => Math.round(v[i] * .2)) },
        { path: "광고-lagrills-info", event: true, count: Math.round(b * .9) }, { path: "광고-lagrills-book", event: true, count: Math.round(b * .25) }, { path: "광고-lagrills-tel", event: true, count: Math.round(b * .1) }, { path: "광고-lagrills-map", event: true, count: Math.round(b * .15) },
        { path: "/ad", event: false, count: Math.round(b * 1.6) }, { path: "급식-보기", event: true, count: b * 3 }, { path: "학원-비교", event: true, count: b * 2 }, { path: "행사-도서관", event: true, count: b }, { path: "날씨-보기", event: true, count: Math.round(b * 1.5) }] };
    const now = new Date(Date.now() + 9 * 3600e3).toISOString().slice(0, 16).replace("T", " ");
    const ago = h => new Date(Date.now() + 9 * 3600e3 - h * 3600e3).toISOString().slice(0, 16).replace("T", " ");
    DATA.fresh[c.k] = { latest: ago(5), meals: ago(5), kinder: ago(6), events: ago(5), jobs: ago(5), weather: ago(2), academies: ago(c.k === "yongin" ? 96 : 5), deals: ["yongin", "suwon"].includes(c.k) ? null : ago(4) };
    if (c.k === "goyang") DATA.fresh[c.k].events = ago(50);
  }
  unlocked = true; SESS = "demo"; ls.get = (k) => k === VAULT ? "{}" : null;
  const m = location.search.match(/tab=(\w+)/); if (m) tab = m[1];
}
render();
if ("serviceWorker" in navigator && !DEMO) navigator.serviceWorker.register("sw.js").catch(() => {});
</script>
