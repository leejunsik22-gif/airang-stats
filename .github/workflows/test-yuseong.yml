name: test-yuseong (유성 1구 시험 배포 — pages.dev, 수동 실행만)
# 2026-11-02 클로드: daejeon-setup 브랜치의 유성 앱 + 수집 데이터를 Cloudflare Pages 시험 프로젝트에 올린다.
# 정식 배포(cf-apps, 도메인)와 별개. 검색 노출 없음(robots noindex 헤더). 대표 승인 후 수동 실행.
on:
  workflow_dispatch:
    inputs:
      ref: { description: "airang-cities 가지", default: "daejeon-setup" }
      city: { description: "도시 키", default: "yuseong" }
permissions:
  contents: read
jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ec2068662f417d156ec0ebeda41a396e
    steps:
      - uses: actions/checkout@v4
        with: { repository: leejunsik22-gif/airang-cities, ref: "${{ github.event.inputs.ref }}", path: cities }
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - name: 빌드 + 데이터 포함
        run: |
          set -e
          C=${{ github.event.inputs.city }}
          cd cities && python3 app/build.py --city $C --out ../out && cd ..
          mkdir -p out/$C/data && cp cities/data/$C/*.json out/$C/data/
          printf '/*\n  X-Robots-Tag: noindex\n' > out/$C/_headers
          ls out/$C | head; du -sh out/$C
      - name: Cloudflare Pages 배포(시험)
        run: |
          npm i -g wrangler@3 >/dev/null 2>&1
          C=${{ github.event.inputs.city }}
          P=airang-daejeon-test-$C
          wrangler pages project create $P --production-branch main >/dev/null 2>&1 || true
          wrangler pages deploy out/$C --project-name $P --branch main --commit-dirty=true 2>&1 | tail -3
          echo "주소: https://$P.pages.dev"
