name: cleanup-test (시험 프로젝트 삭제 — 1회용, 수동)
# 2026-11-02 대표 지시("시험용은 삭제"): airang-daejeon-test-yuseong Pages 프로젝트를 지운다. 정식 airang-daejeon-all 은 건드리지 않음.
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  del:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ec2068662f417d156ec0ebeda41a396e
    steps:
      - run: |
          npm i -g wrangler@3 >/dev/null 2>&1
          wrangler pages project delete airang-daejeon-test-yuseong --yes 2>&1 | tail -3
          echo "== 남은 프로젝트"; wrangler pages project list 2>&1 | tail -6
