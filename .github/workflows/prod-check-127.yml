name: prod-check-127 (127 운영 반영 뒤 운영 주소 확인 — 읽기만)
# 2026-11-13 대표 승인(11:05) 127 개인 메일 → 문의하기 운영 반영(airang-cities main 0d6557c) 뒤 확인. 124 확인 항목도 그대로 다시 봄.
# 2026-11-13 대표 승인(10:38) 124 운영 반영(airang-cities main 8daa693) 뒤 확인. 운영 주소를 읽기만 하고 아무것도 바꾸지 않음. 방문 통계 차단.
on:
  push:
    branches: [prod-check-127]
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    env:
      GUS: "djdonggu djjunggu djseogu yuseong daedeok"
    steps:
      - name: 운영 주소에서 확인 (주소·안내 페이지)
        run: |
          B=https://airang-daejeon-all.pages.dev; ok=0; bad=0
          chk() { if [ "$2" = "$3" ]; then echo "통과 | $1 ($2)"; ok=$((ok+1)); else echo "실패 | $1 (기대 $3, 실제 $2)"; bad=$((bad+1)); fi; }
          chk "F2 기본 주소 → 입구로 넘김(302)" "$(curl -s -o /dev/null -w '%{http_code}' $B/)" 302
          chk "F2 넘기는 곳 = /entry/" "$(curl -s -o /dev/null -w '%{redirect_url}' $B/ | sed 's#^https://[^/]*##')" /entry/
          chk "F2 기본 주소에 개발용 목록 없음" "$(curl -sL $B/ | grep -c '아이랑 (시험)' || true)" 0
          chk "입구 열림" "$(curl -s -o /dev/null -w '%{http_code}' $B/entry/)" 200
          for g in $GUS; do
            chk "$g 화면 열림" "$(curl -s -o /dev/null -w '%{http_code}' $B/$g/)" 200
            curl -s $B/$g/guide/ -o gi.html
            chk "$g F1 안내 페이지 열림" "$(curl -s -o /dev/null -w '%{http_code}' $B/$g/guide/)" 200
            chk "$g F1 안내 페이지 '0곳·0개' 없음" "$(grep -oE '>0(곳|개)<' gi.html | wc -l)" 0
            chk "$g F1 안내 페이지 '소아과' 없음" "$(grep -c '소아과' gi.html || true)" 0
            chk "$g F1 없는 소아과 페이지로 링크 없음" "$(curl -s $B/$g/guide/school-start.html | grep -c 'pediatrics.html' || true)" 0
                      done
          # 127: 개인 메일 주소 노출 0건(입구·5개 구 앱·안내 페이지·문의하기) + 문의하기 열림
          chk "127 문의하기 화면 열림" "$(curl -s -o /dev/null -w '%{http_code}' $B/inquiry/)" 200
          for u in /entry/ /inquiry/ /_list/; do chk "127 $u 개인 메일 없음" "$(curl -sL $B$u | grep -c 'leejunsik22@gmail' || true)" 0; done
          for g in $GUS; do
            chk "127 $g 앱 개인 메일 없음" "$(curl -s $B/$g/ | grep -c 'leejunsik22@gmail' || true)" 0
            for f in $(curl -s $B/$g/guide/ | grep -o 'href="[^"]*\.html"' | sed 's/href="//;s/"//' | sort -u | head -20); do chk "127 $g 안내 $f 개인 메일 없음" "$(curl -s $B/$g/guide/$f | grep -c 'leejunsik22@gmail' || true)" 0; done
          done
          echo "합계: 통과 $ok / 실패 $bad"; [ $bad -eq 0 ]
      - name: 운영 주소를 휴대폰 크기 브라우저로 열어 확인 (F3 + 학원 검색)
        run: |
      - name: 운영 주소를 휴대폰 크기 브라우저로 확인 (①한글 입력 ②글자 최대 + 기존 117·118)
        run: |
          mkdir pw && cd pw && npm init -y >/dev/null && npm i playwright@1.48.2 >/dev/null 2>&1 && npx playwright install --with-deps chromium >/dev/null 2>&1
          cat > c.js <<'JS'
          const { chromium, devices } = require("playwright");
          (async () => {
            const B = "https://airang-daejeon-all.pages.dev"; let bad = 0;
            const ok = (n, c, v) => { console.log((c ? "통과" : "실패") + " | " + n + (v !== undefined ? " (" + v + ")" : "")); if (!c) bad++; };
            const br = await chromium.launch();
            const P = { "수": ["ㅅ", "수"], "학": ["ㅎ", "하", "학"], "영": ["ㅇ", "여", "영"], "어": ["ㅇ", "어"] };
            for (const g of process.env.GUS.split(" ")) {
              const ctx = await br.newContext({ ...devices["Galaxy S9+"], serviceWorkers: "block" }); await ctx.route(/goatcounter|gc\.zgo/, r => r.abort());
              const p = await ctx.newPage(); const errs = []; p.on("pageerror", e => errs.push(String(e))); const cdp = await ctx.newCDPSession(p);
              const typ = async (sel, w) => { await p.click(sel); for (const ch of w) { for (const x of (P[ch] || [ch])) { await cdp.send("Input.imeSetComposition", { text: x, selectionStart: x.length, selectionEnd: x.length }); await p.waitForTimeout(450); } await cdp.send("Input.insertText", { text: ch }); await p.waitForTimeout(450); } await p.waitForTimeout(800); };
              await p.goto(B + "/" + g + "/?nocount=1"); await p.waitForLoadState("networkidle"); await p.waitForTimeout(800);
              const ph = await p.locator("input[name=q]").getAttribute("placeholder"); ok(g + " 117 검색 안내 그대로", ph === "학원, 학교 이름", ph);
              await p.goto(B + "/" + g + "/?nocount=1#schools"); await p.waitForTimeout(1200); await typ("#q", "학"); ok(g + " ① 학교 검색칸 '학'", (await p.inputValue("#q")) === "학", await p.inputValue("#q"));
              await p.goto(B + "/" + g + "/?nocount=1#acas"); await p.waitForTimeout(1500); await typ("#acaq", "수학"); ok(g + " ① 학원 검색칸(느리게) '수학'", (await p.inputValue("#acaq")) === "수학", await p.inputValue("#acaq"));
              await p.goto(B + "/" + g + "/?nocount=1#hosp"); await p.waitForTimeout(1000); ok(g + " 병원은 계속 준비 중(공개 안 됨)", (await p.locator("#view").innerText()).includes("준비 중"));
              ok(g + " 스크립트 오류 없음", errs.length === 0, errs.join(" | ").slice(0, 200));
              await ctx.close();
            }
            for (const z of [1.5, 2, 3]) {
              const W = Math.round(412 / z); const ctx = await br.newContext({ viewport: { width: W, height: Math.round(915 / z) }, deviceScaleFactor: 2.625 * z, isMobile: true, hasTouch: true, serviceWorkers: "block" }); await ctx.route(/goatcounter|gc\.zgo/, r => r.abort()); const p = await ctx.newPage();
              for (const scr of ["", "#find/" + encodeURIComponent("영어"), "#acas"]) {
                await p.goto(B + "/yuseong/?nocount=1" + scr); await p.waitForLoadState("networkidle"); await p.waitForTimeout(900);
                const r = await p.evaluate(() => { const nav = document.querySelector("nav.nav"), nr = nav.getBoundingClientRect(); const vis = [...nav.querySelectorAll(".navi")].filter(b => { const q = b.getBoundingClientRect(); return q.left >= nr.left - 1 && q.right <= innerWidth + 1 && q.width > 20; }).length; return { vis, sw: document.documentElement.scrollWidth, iw: innerWidth }; });
                const nm = "확대 " + z * 100 + "% " + (scr ? decodeURIComponent(scr) : "홈");
                ok(nm + " 아래 메뉴 5칸·가로 넘침 없음", r.vis === 5 && r.sw <= r.iw + 2, JSON.stringify(r));
              }
              if (z === 3) {
                await p.goto(B + "/yuseong/?nocount=1"); await p.waitForLoadState("networkidle"); await p.waitForTimeout(800);
                const b1 = await p.evaluate(() => { const b = document.querySelector("button.banner3"); if (!b) return null; const R = b.getBoundingClientRect(), t = [...b.querySelectorAll(".bt b,.bt span")].map(e => e.getBoundingClientRect()), G = b.querySelector(".img-tag").getBoundingClientRect(); const ov = (a, c) => !(a.right <= c.left || c.right <= a.left || a.bottom <= c.top || c.bottom <= a.top); return { cut: t.some(r => r.bottom > R.bottom + 1), over: t.some(r => ov(r, G)) }; });
                ok("② 300% 행사 띠 잘림·겹침 없음", !b1 || (!b1.cut && !b1.over), JSON.stringify(b1));
                await p.goto(B + "/yuseong/?nocount=1#find/" + encodeURIComponent("영어")); await p.waitForTimeout(1200);
                ok("② 300% 검색 결과 이름 잘림 없음", await p.evaluate(() => { const d = document.querySelector("a.find-row div div"); return d ? d.scrollWidth <= d.clientWidth + 1 : false; }));
                await p.goto(B + "/yuseong/?nocount=1#acas"); await p.waitForTimeout(1200);
                ok("② 300% 수강료 중간값 한 줄", await p.evaluate(() => { const c = document.querySelector(".aca-sum"); if (!c) return false; const v = [...c.querySelectorAll("div")].find(d => /원$/.test(d.innerText) && !d.children.length); return v.getBoundingClientRect().height <= parseFloat(getComputedStyle(v).fontSize) * 1.6; }));
              }
              await ctx.close();
            }
            // 127: 화면에서 개인 메일 없음 + 문의하기 연결
            { const ctx = await br.newContext({ ...devices["Galaxy S9+"], serviceWorkers: "block" }); await ctx.route(/goatcounter|gc\.zgo/, r => r.abort()); const p = await ctx.newPage(); const errs = []; p.on("pageerror", e => errs.push(String(e)));
              for (const g of process.env.GUS.split(" ")) for (const r of ["", "#my", "#about", "#news"]) { await p.goto(B + "/" + g + "/?nocount=1" + r); await p.waitForTimeout(900); ok("127 " + g + " " + (r || "홈") + " 화면 개인 메일 없음", !/leejunsik22@gmail/.test(await p.content())); }
              await p.goto(B + "/yuseong/?nocount=1#my"); await p.waitForTimeout(1000);
              const href = await p.locator("a", { hasText: "문의하기" }).first().getAttribute("href"); ok("127 마이 → 문의하기 링크", /inquiry\/\?kind=use/.test(href || ""), href);
              await p.goto(new URL(href, B + "/yuseong/").href); await p.waitForTimeout(1200); ok("127 문의하기 열림·이용 문의 선택", await p.locator("input[value=use]").isChecked());
              ok("127 문의하기 보내기 버튼 있음(누르지 않음)", (await p.locator("#send").count()) === 1);
              await p.goto(B + "/yuseong/?nocount=1#about"); await p.waitForTimeout(1000); ok("127 이용 안내 → 문의하기 링크", (await p.locator("#view a[href*='inquiry/?kind=use']").count()) > 0);
              await p.goto(B + "/entry/"); await p.waitForTimeout(800); ok("127 입구 → 문의하기 링크", (await p.locator("a[href*='inquiry/']").count()) > 0);
              ok("127 스크립트 오류 없음", errs.length === 0, errs.join(" | ").slice(0, 200));
              await ctx.close(); }
            await br.close(); console.log("브라우저 확인 실패 " + bad); process.exit(bad ? 1 : 0);
          })();
          JS
          sed -i 's/^          //' c.js; GUS="$GUS" node c.js
