name: inquiry-test (문의하기 A안 — 시험 주소 전용, 운영과 분리)
# 2026-11-09 대표 승인: D1 시험 환경 연결까지만. 운영 사이트(airang-daejeon-all)는 건드리지 않는다.
# 시험 주소: https://airang-inquiry-test.pages.dev  (별도 Pages 프로젝트 + D1 airang-inquiry-test)
# 관리자 로그인 v02(대표 결정 11/9: 카드 없는 무료 방식): 비밀번호 ADMIN_PASSWORD 는 대표가 Cloudflare 화면에서 '비밀(Secret)'로 직접 등록(코드·GitHub 에 없음).
# 이 작업은 비밀번호를 모르므로 '막히는지'만 확인한다(로그인 성공·상태 변경은 대표 갤럭시 직접 확인).
on:
  push:
    branches: [inquiry-test]
    paths: [".github/workflows/inquiry-test.yml"]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test-env:
    if: github.ref == 'refs/heads/inquiry-test'
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ec2068662f417d156ec0ebeda41a396e
      PROJ: airang-inquiry-test
      DBNAME: airang-inquiry-test
    steps:
      - uses: actions/checkout@v4
        with: { repository: leejunsik22-gif/airang-cities, ref: inquiry-a, path: src }
      - uses: actions/setup-node@v4
        with: { node-version: "20" }
      - name: 시험 가지 확인 (운영 main 아님)
        run: cd src && git log --oneline -1 && test "$(git rev-parse --abbrev-ref HEAD)" = "inquiry-a"
      - name: D1 시험 저장소 (없으면 만들기)
        run: |
          npm i -g wrangler@3 >/dev/null 2>&1
          id=$(wrangler d1 list --json 2>/tmp/e | jq -r --arg n "$DBNAME" '.[] | select(.name==$n) | .uuid' || true)
          if [ -z "$id" ]; then wrangler d1 create "$DBNAME" > /tmp/c 2>&1 || { cat /tmp/c /tmp/e; echo "::error::D1 만들기 실패(토큰 권한 확인 필요)"; exit 1; }
            id=$(wrangler d1 list --json | jq -r --arg n "$DBNAME" '.[] | select(.name==$n) | .uuid'); echo "D1 새로 만듦"; else echo "D1 이미 있음"; fi
          echo "D1_ID=$id" >> $GITHUB_ENV; echo "D1: $DBNAME ($id)"
      - name: 화면 빌드 + 설정
        run: |
          mkdir -p w && cd w
          python3 ../src/app/build.py --out site --city entry >/dev/null
          printf '/*\n  X-Robots-Tag: noindex, nofollow\n' > site/_headers
          printf '<!doctype html><meta charset="utf-8"><meta name="robots" content="noindex"><title>아이랑 문의 시험</title><p>시험 주소입니다. <a href="/inquiry/">문의하기</a> · <a href="/inquiry/admin/">접수함</a></p>\n' > site/index.html
          cp -r ../src/functions ./functions
          SALT=$(openssl rand -hex 16)
          cat > wrangler.toml <<TOML
          name = "$PROJ"
          pages_build_output_dir = "site"
          compatibility_date = "2024-09-23"
          [[d1_databases]]
          binding = "INQ_DB"
          database_name = "$DBNAME"
          database_id = "$D1_ID"
          [vars]
          HASH_SALT = "$SALT"
          TOML
          sed -i 's/^          //' wrangler.toml; cat wrangler.toml
      - name: 시험 주소에 올리기 (별도 프로젝트)
        run: |
          cd w
          wrangler pages project create "$PROJ" --production-branch main >/dev/null 2>&1 || true
          wrangler pages deploy --project-name "$PROJ" --branch main --commit-dirty=true 2>&1 | tail -4
      - name: 실제 시험 주소에서 확인 (문의 접수 + 관리자 차단)
        run: |
          B=https://$PROJ.pages.dev; sleep 20
          ok=0; bad=0; chk() { if echo "$2" | grep -qxE "$3"; then echo "통과 | $1 ($2)"; ok=$((ok+1)); else echo "실패 | $1 (기대 $3, 실제 $2)"; bad=$((bad+1)); fi; }
          code() { curl -s -o /tmp/o -w "%{http_code}" "$@"; }
          chk "문의 화면 열림" "$(code -L $B/inquiry/)" 200
          chk "입구 '문의하기' 버튼" "$(curl -sL $B/entry/ | grep -c 'id="btn-contact"')" 1
          chk "접수함 화면 틀 열림(자료 없음)" "$(code -L $B/inquiry/admin/)" 200
          r=$(curl -s -X POST $B/api/inquiry -H "origin: $B" -H "content-type: application/json" -d '{"kind":"use","body":"[가상] 시험 주소 자동 점검 — 대표 확인 뒤 지워도 됨"}'); echo "접수 응답: $r"
          chk "문의 접수 번호 받음" "$(echo "$r" | jq -r '.ok')" true
          pw=$(curl -s $B/api/inquiry/admin -o /dev/null -w "%{http_code}"); echo "관리자 상태: $pw (503=비밀번호 미등록, 401=등록됨·로그인 필요)"
          chk "로그인 없이 접수함 자료 차단" "$pw" "401|503"
          chk "틀린 비밀번호 거절" "$(code -X POST $B/api/inquiry/login -H "origin: $B" -H 'content-type: application/json' -d '{"password":"wrong-password-ci"}')" "401|503"
          chk "위조 로그인 쿠키 차단" "$(code $B/api/inquiry/admin -H "cookie: airang_admin=9999999999999.$(printf '0%.0s' {1..64})")" "401|503"
          chk "다른 사이트에서 로그인 시도 차단" "$(code -X POST $B/api/inquiry/login -H 'origin: https://evil.example' -H 'content-type: application/json' -d '{"password":"x"}')" "403|503"
          chk "로그인 없이 상태 변경 차단" "$(code -X POST $B/api/inquiry/admin -H "origin: $B" -H 'content-type: application/json' -d '{"action":"delete","id":1}')" "401|503"
          echo "합계: 통과 $ok / 실패 $bad"; [ $bad -eq 0 ]
