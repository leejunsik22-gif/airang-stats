name: relay
on:
  workflow_dispatch:
  push:
    paths: ["worker/gc-relay.js", ".github/workflows/relay.yml"]
permissions:
  contents: write
jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Cloudflare에 중계기 올리기
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: fdf0f693700c270e15a856ec9453fde7   # 계정 ID는 비밀값이 아니라 파일에 둠
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then echo "Cloudflare 키 없음 — 건너뜀"; exit 0; fi
          npx -y wrangler@3 deploy worker/gc-relay.js --name gc-relay --compatibility-date 2026-09-01 2>&1 | tee /tmp/out.txt
          url=$(grep -o 'https://[a-zA-Z0-9.-]*workers\.dev' /tmp/out.txt | head -1)
          [ -n "$url" ] || { echo "주소를 못 찾음"; exit 1; }
          echo "$url" > relay.txt
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add relay.txt
          git diff --cached --quiet || { git commit -m "중계기 주소"; for i in 1 2 3; do git pull --rebase && git push && break; sleep 5; done; }
