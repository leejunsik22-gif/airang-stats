name: stats
on:
  # 매시간 돌던 예전 용인·수원 통계 모으기 — 관리자 화면이 따로 모으게 되어 끔 (2026-11-01, GitHub 무료 실행 시간 아끼기)
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: stats
  cancel-in-progress: false
jobs:
  stats:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -u stats.py
        env:
          GC_KEY_YONGIN: ${{ secrets.GC_KEY_YONGIN }}
          GC_KEY_SUWON: ${{ secrets.GC_KEY_SUWON }}
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data
          git diff --cached --quiet && exit 0
          git commit -m "통계 업데이트"
          for i in 1 2 3; do git pull --rebase && git push && break; sleep 5; done
