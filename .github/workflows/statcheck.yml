name: statcheck (집계 점검 — 관제·모음·GoatCounter 숫자 비교)
on: workflow_dispatch
permissions:
  contents: write
jobs:
  c:
    runs-on: ubuntu-latest
    env:
      GC_KEY_YONGIN: ${{ secrets.GC_KEY_YONGIN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with: { repository: leejunsik22-gif/airang-cities, path: src-cities, sparse-checkout: app/cities.json }
      - uses: actions/setup-node@v4
        with: { node-version: "20" }
      - run: |
          python3 -c "import json;c=json.load(open('src-cities/app/cities.json'))['cities'];print(json.dumps([[k] for k in c]))" > /tmp/c.json
          node snap/statcheck.mjs /tmp/c.json; mkdir -p data; cp statcheck.md data/statcheck.md
          git config user.name "github-actions[bot]"; git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/statcheck.md; git commit -qm "집계 점검 기록" && for i in 1 2 3; do git pull --rebase --autostash && git push && break; sleep 5; done
