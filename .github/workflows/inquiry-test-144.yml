name: inquiry-test-144 (문의 개인정보 차단 규칙 — 실제 서버 시험, 시험 저장소만)
# 2026-11-19 144 (피트 143 검토 지시 3번 "별도 시험 환경에서 실제 서버 동작 검증"):
#  - 기존 시험 환경 airang-inquiry-test(Pages 프로젝트) + 시험 D1 airang-inquiry-test 만 사용 (2026-11-09 대표 승인 "D1 시험 환경 연결까지" 범위)
#  - 운영 사이트 airang-daejeon-all · 운영 D1 airang-inquiry 는 읽기 확인만(배포 기록 조회), 쓰지 않음
#  - 원본: airang-cities fix-143-rules (후보 가지, 운영 main 아님). 134·142 가지는 쓰지 않음
#  - 모든 시험 글은 가상 값, '[가상] 144' 로 시작 → 끝나면 시험 D1 에서 지움
on:
  push:
    branches: [inquiry-test-144]
    paths: [".github/workflows/inquiry-test-144.yml"]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  rules-on-real-server:
    if: github.ref == 'refs/heads/inquiry-test-144'
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ec2068662f417d156ec0ebeda41a396e
      PROJ: airang-inquiry-test
      DBNAME: airang-inquiry-test
      PROD_PROJ: airang-daejeon-all
      PROD_D1_PREFIX: 1ba3b298
    steps:
      - uses: actions/checkout@v4
        with: { repository: leejunsik22-gif/airang-cities, ref: fix-143-rules, path: src }
      - uses: actions/setup-node@v4
        with: { node-version: "20" }
      - name: 원본 가지 확인 (운영 main 아님)
        run: cd src && git log --oneline -3 && test "$(git rev-parse --abbrev-ref HEAD)" = "fix-143-rules" && test -f tests/cases/inquiry_boundary_144.json
      - name: 운영과 분리 확인 (시험 D1 이름·번호, 운영 배포 기록 — 읽기만)
        run: |
          npm i -g wrangler@3 >/dev/null 2>&1
          id=$(wrangler d1 list --json | jq -r --arg n "$DBNAME" '.[] | select(.name==$n) | .uuid')
          test -n "$id" || { echo "::error::시험 D1 없음 — 새로 만들지 않고 멈춤"; exit 1; }
          case "$id" in $PROD_D1_PREFIX*) echo "::error::운영 D1 번호와 같음 — 멈춤"; exit 1;; esac
          echo "D1_ID=$id" >> $GITHUB_ENV; echo "시험 D1: $DBNAME (${id:0:8}…) · 운영 D1 번호(${PROD_D1_PREFIX}…)와 다름"
          api() { curl -s -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/pages/projects/$1/deployments?per_page=1" | jq -r '.result[0] | "\(.id[0:8]) \(.created_on)"'; }
          p=$(api $PROD_PROJ); echo "PROD_BEFORE=$p" >> $GITHUB_ENV; echo "운영 최근 배포(시험 전): $p"
      - name: 화면 빌드 + 설정 (시험 D1 만 연결)
        run: |
          mkdir -p w && cd w
          python3 ../src/app/build.py --out site --city entry >/dev/null
          printf '/*\n  X-Robots-Tag: noindex, nofollow\n' > site/_headers
          printf '<!doctype html><meta charset="utf-8"><meta name="robots" content="noindex"><title>아이랑 문의 시험</title><p>시험 주소입니다. <a href="/inquiry/">문의하기</a> · <a href="/inquiry/admin/">접수함</a></p>\n' > site/index.html
          cp -r ../src/functions ./functions
          SALT=$(openssl rand -hex 16)
          printf 'name = "%s"\npages_build_output_dir = "site"\ncompatibility_date = "2024-09-23"\n[[d1_databases]]\nbinding = "INQ_DB"\ndatabase_name = "%s"\ndatabase_id = "%s"\n[vars]\nHASH_SALT = "%s"\n' "$PROJ" "$DBNAME" "$D1_ID" "$SALT" > wrangler.toml
          grep -v HASH_SALT wrangler.toml | sed "s/$D1_ID/${D1_ID:0:8}…/"
          grep -c "forCheck" functions/_shared/inquiry.js
      - name: 시험 주소에 올리기 (시험 프로젝트만)
        run: |
          cd w
          test "$PROJ" = "airang-inquiry-test"
          wrangler pages deploy --project-name "$PROJ" --branch main --commit-dirty=true 2>&1 | tail -3
      - name: 실제 서버에서 경계 사례 보내 보기
        run: |
          B=https://$PROJ.pages.dev; sleep 25
          node --input-type=module - "$B" src/tests/cases/inquiry_boundary_144.json <<'JS'
          import fs from "fs";
          const [B, file] = process.argv.slice(2); const c = JSON.parse(fs.readFileSync(file, "utf8"));
          const strip = (b) => b.replace(/ \([^)]*\)$/, "");
          const post = async (kind, body) => { const r = await fetch(B + "/api/inquiry", { method: "POST", headers: { origin: B, "content-type": "application/json" }, body: JSON.stringify({ kind, body: "[가상] 144 " + body }) }); let j = {}; try { j = await r.json(); } catch (e) {} return { s: r.status, msg: j.msg || "" }; };
          let ok = 0, bad = 0, s200 = 0, s429 = 0;
          const want = { 전화: "전화번호는 지워 주세요", 메일: "이메일 주소는 지워 주세요", 주민: "주민등록번호처럼" };
          for (const [b0, k] of c.block) { const r = await post("use", strip(b0)); const g = r.s === 400 && r.msg.startsWith(want[k]); console.log((g ? "통과" : "실패") + " | 거절(" + k + ") | " + JSON.stringify(b0) + " → " + r.s + " " + r.msg.slice(0, 14)); g ? ok++ : bad++; }
          for (const b of c.pass) { const r = await post("fix", b); const g = r.s === 200 || r.s === 429; if (r.s === 200) s200++; if (r.s === 429) s429++; console.log((g ? "통과" : "실패") + " | 접수(규칙 통과) | " + JSON.stringify(b) + " → " + r.s + (r.s === 429 ? " (규칙은 통과, 같은 기기 10분 5건 제한)" : "")); g ? ok++ : bad++; }
          for (const b0 of c.limit || []) { const r = await post("use", strip(b0)); console.log("기록 | 한계 | " + JSON.stringify(b0) + " → " + r.s + " " + r.msg.slice(0, 14)); }
          console.log(`합계: 통과 ${ok} / 실패 ${bad} · 정상 글 응답 200=${s200}, 429=${s429}`); process.exit(bad ? 1 : 0);
          JS
      - name: 시험 글 정리 + 운영 배포 기록 재확인
        if: always()
        run: |
          cd w
          n=$(wrangler d1 execute "$DBNAME" --remote --json --command "DELETE FROM inquiries WHERE body LIKE '[가상] 144 %'" 2>/dev/null | jq -r '.[0].meta.changes // "?"'); echo "시험 D1 에서 '[가상] 144' 글 $n건 지움"
          left=$(wrangler d1 execute "$DBNAME" --remote --json --command "SELECT COUNT(*) AS n FROM inquiries WHERE body LIKE '[가상] 144 %'" 2>/dev/null | jq -r '.[0].results[0].n // "?"'); echo "남은 '[가상] 144' 글: $left"
          p=$(curl -s -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/pages/projects/$PROD_PROJ/deployments?per_page=1" | jq -r '.result[0] | "\(.id[0:8]) \(.created_on)"')
          echo "운영 최근 배포(시험 뒤): $p"; test "$p" = "$PROD_BEFORE" && echo "운영 배포 변화 없음" || echo "::warning::운영 배포 기록이 바뀜 — 정기 배포(cf-apps)인지 확인 필요"
