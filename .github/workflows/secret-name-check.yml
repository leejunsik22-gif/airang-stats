name: secret-name-check (운영 사이트 비밀값 '이름·종류'만 조회 — 값은 읽지 않음, 쓰기 없음)
# 2026-11-21 149: 대표가 Cloudflare 화면에서 ADMIN_PASSWORD 재등록 후 운영이 "비밀번호 설정 안 됨"(503) → 원인 확인용. GET 만 사용.
on:
  push: { branches: [secret-name-check], paths: [".github/workflows/secret-name-check.yml"] }
permissions: { contents: read }
jobs:
  check:
    if: github.ref == 'refs/heads/secret-name-check'
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      A: ec2068662f417d156ec0ebeda41a396e
    steps:
      - name: 이름·종류만 조회
        run: |
          r=$(curl -s "https://api.cloudflare.com/client/v4/accounts/$A/pages/projects/airang-daejeon-all" -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN")
          for e in production preview; do echo "$e: $(echo "$r" | jq -c --arg e $e '[(.result.deployment_configs[$e].env_vars // {}) | to_entries[] | "\(.key)(\(.value.type))"]')"; done
          d=$(curl -s "https://api.cloudflare.com/client/v4/accounts/$A/pages/projects/airang-daejeon-all/deployments?per_page=1" -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN")
          echo "최근 배포: $(echo "$d" | jq -c '.result[0] | {id: .id[0:8], env: .environment, at: .created_on, vars: ((.env_vars // {}) | to_entries | map("\(.key)(\(.value.type))"))}')"
