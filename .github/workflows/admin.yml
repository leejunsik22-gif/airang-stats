name: admin (관리자 사이트를 Cloudflare Pages로)
on:
  workflow_dispatch:
  push:   # 2026-11-02 대표 승인으로 자동 배포 켬
    branches: [main]
    paths: ["admin/**", ".github/workflows/admin.yml"]
permissions:
  contents: write
jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ec2068662f417d156ec0ebeda41a396e
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "20" }
      - run: |
          mkdir -p data; exec > >(tee data/admin.txt) 2>&1
          npm i -g wrangler@3 >/dev/null 2>&1
          wrangler pages project create airang-daejeon-admin --production-branch main >/dev/null 2>&1 || true
          wrangler pages deploy admin --project-name airang-daejeon-admin --branch main --commit-dirty=true 2>&1 | tail -3
          echo "pages.dev: $(curl -s -o /tmp/p.html -w '%{http_code}' https://airang-daejeon-admin.pages.dev/) $(grep -o '<title>[^<]*' /tmp/p.html)"   # 자체 도메인 없음 — pages.dev 주소만 (2026-11-02 대표 결정)
      - run: |
          git config user.name "github-actions[bot]"; git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/admin.txt; git diff --cached --quiet && exit 0
          git commit -m "관리자 배포 기록"; for i in 1 2 3; do git pull --rebase --autostash && git push && break; sleep 5; done
