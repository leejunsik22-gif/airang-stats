name: dnscheck (아이랑 10개 주소·배포 버전 확인)
on: workflow_dispatch
permissions:
  contents: write
jobs:
  check:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      A: fdf0f693700c270e15a856ec9453fde7
    steps:
      - uses: actions/checkout@v4
      - run: |
          set +e; mkdir -p data
          {
          date -u
          echo "== 네임서버"; dig +short NS daejeon.example.invalid @1.1.1.1
          for h in namyangju ansan siheung paju gimpo uijeongbu gwangju hanam seocho songpa gangdong gwangjin mapo seongdong; do
            d=$h.daejeon.example.invalid
            c=$(dig +short CNAME $d @1.1.1.1 | head -1)
            code=$(curl -s -o /dev/null -m 20 -w "%{http_code}" https://$d/)
            st=$(curl -s "https://api.cloudflare.com/client/v4/accounts/$A/pages/projects/airang-$h/domains/$d" -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" | python3 -c "import sys,json;r=json.load(sys.stdin).get('result') or {};print(r.get('status','?'), (r.get('validation_data') or {}).get('status',''))" 2>/dev/null)
            echo "$d  CNAME=$c  HTTPS=$code  Pages=$st"
            if [ "$h" != admin ]; then
              live=$(curl -s -m 20 "https://$d/sw.js?t=$(date +%s)" | grep -o 'CACHE = "[^"]*"')
              pg=$(curl -s -m 20 "https://airang-$h.pages.dev/sw.js?t=$(date +%s)" | grep -o 'CACHE = "[^"]*"')
              ver=$(curl -s -m 20 "https://$d/?t=$(date +%s)" | grep -o 'APP_VER = "[^"]*"')
              hdr=$(curl -sI -m 20 "https://$d/sw.js" | grep -iE "^(server|cf-cache-status|age|cache-control):" | tr -d '\r' | tr '\n' ' ')
              echo "    버전 확인: 실제주소 $live / pages.dev $pg / $ver / $hdr"
            fi
          done
          } > data/dnscheck.txt 2>&1
          cat data/dnscheck.txt
          git config user.name "github-actions[bot]"; git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/dnscheck.txt; git commit -qm "DNS 확인 기록" && for i in 1 2 3; do git pull --rebase --autostash && git push && break; sleep 5; done
